# The peerline conformance suite: the shared handler-set + battery two
# implementations must both satisfy, and every runner that exercises it.
#
# It lives in its own crate rather than behind a feature on `peerline` because
# it is test scaffolding, and every consumer of it is a dev target. Keeping it
# out of `peerline` means the protocol crate carries no test code in its public
# API or its published tarball, and — since the battery needs a barrier and
# timeouts — no runtime dependency either.
#
# `publish = false`: the matrix and the interop binaries are harnesses, not
# something to install from crates.io.
[package]
name = "peerline-conformance"
description = "Shared conformance handler-set and battery for peerline implementations, plus the cross-transport matrix and the cross-language interop harness."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The two halves of the cross-language interop harness. Binaries rather than
# examples: they are harnesses the `just interop` recipe spawns, not code
# anyone should read as a usage demonstration.
[[bin]]
name = "conformance_server"
required-features = ["ws"]

[[bin]]
name = "conformance_client"
required-features = ["ws"]

[features]
default = []
# The interop binaries need a WebSocket to serve and dial over. The battery
# itself is transport-agnostic, so a consumer that only wants `register` /
# `battery` pulls no transport at all.
# The extra tokio features are what the binaries need on top of the
# library's `sync` + `time`: `#[tokio::main]` and an OS-assigned port.
ws = ["dep:peerline-transport-ws", "tokio/macros", "tokio/rt-multi-thread", "tokio/net"]

[dependencies]
peerline = { workspace = true, features = ["runtime"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `sync` for the barrier the multiplexing check parks on, `time` for its
# timeouts. This is why the battery does not live in `peerline`: it cannot be
# runtime-agnostic.
tokio = { version = "1.43", features = ["sync", "time"] }
peerline-transport-ws = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
# `tests/iroh_seam.rs` drives two raw iroh endpoints directly, below the
# peerline `Peer` layer, so it needs the iroh types themselves.
iroh = "1"
iroh-base = { version = "1", features = ["key"] }
# The cross-transport matrix runs the battery against every transport at once.
peerline-transport-ws = { workspace = true }
peerline-transport-uds = { workspace = true }
peerline-transport-iroh = { workspace = true }
